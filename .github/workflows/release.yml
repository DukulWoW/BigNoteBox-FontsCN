name: Release

# A v* tag push is the whole release: the packager builds the zip, uploads it to
# CurseForge and Wago, and cuts the GitHub release. Same workflow as BigNoteBox's.
#
# WoWInterface is skipped for now: its page holds a hand-uploaded placeholder
# until the listing is approved. To turn it on, give WOWI_API_TOKEN the same
# expression as the other two tokens.
#
# Manual runs pick a mode:
#   dry          - build only, upload nowhere. The safe way to check the zip.
#   github-only  - cut the GitHub release for an existing tag WITHOUT touching the
#                  addon sites. Run it with --ref <tag>. A failed release step
#                  must not mean re-uploading a version that already went out.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        options:
          - dry
          - github-only
        default: dry

# Creating a release is a write to repository contents; without this the built-in
# GITHUB_TOKEN is read-only and the packager fails with 403 after the uploads.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The packager reads tags and history for the version and commit range.
          fetch-depth: 0

      - name: Package
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # The packager skips any site whose token is empty. It expects
          # CF_API_KEY; the secret is CF_API_TOKEN.
          CF_API_KEY: ${{ github.event_name == 'push' && secrets.CF_API_TOKEN || '' }}
          WOWI_API_TOKEN: ''
          WAGO_API_TOKEN: ${{ github.event_name == 'push' && secrets.WAGO_API_TOKEN || '' }}
        with:
          # -n "<file name>:<upload label>". The label is what the sites show as the
          # release name. No spaces possible (filename_filter), so a hyphen.
          args: >-
            -n "{package-name}-{project-version}:{package-name}-{project-version}"
            ${{ inputs.mode == 'dry' && '-d' || '' }}

      - name: Keep the build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            .release/*.zip
            .release/*.md
            .release/*.txt
          # .release is a dotted directory; upload-artifact v4 skips hidden paths
          # unless told otherwise.
          include-hidden-files: true
          if-no-files-found: warn
